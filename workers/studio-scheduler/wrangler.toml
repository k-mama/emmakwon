# Small, standalone scheduler Worker — NOT the Pages project. Deploy
# separately from the site:
#   npx wrangler deploy --config workers/studio-scheduler/wrangler.toml
# (run from the repo root, so it resolves the shared src/lib modules and
# node_modules correctly).
#
# database_id below is a PLACEHOLDER — must match the real D1 database
# bound in the root wrangler.toml (same database, same binding name,
# both the Pages project and this Worker read/write the one
# studio_posts table). See CLOUDFLARE_SETUP.md.
name = "emmakwon-studio-scheduler"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "STUDIO_DB"
database_name = "emmakwon-studio"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# This site publishes roughly weekly — five minutes is more than
# frequent enough and comfortably inside Cloudflare's free-tier cron
# limits. Cloudflare Cron is UTC-based, which matches scheduled_at being
# stored as UTC — no timezone conversion happens in this Worker.
[triggers]
crons = ["*/5 * * * *"]
