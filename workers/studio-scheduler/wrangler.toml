# Small, standalone scheduler Worker — NOT the Pages project. Deploy
# separately from the site:
#   npx wrangler deploy --config workers/studio-scheduler/wrangler.toml
# (run from the repo root, so it resolves the shared src/lib modules and
# node_modules correctly).
#
# database_id below is a PLACEHOLDER. Unlike the Pages project (whose D1
# binding lives in the Cloudflare dashboard, not a wrangler.toml — see
# CLOUDFLARE_SETUP.md), this standalone Worker has no dashboard-driven
# alternative: wrangler.toml IS its real deployment config. That's fine
# — deploying it is a separate, explicit `wrangler deploy` step the user
# runs manually (see CLOUDFLARE_SETUP.md step F), never triggered by a
# git push, so a placeholder sitting here carries no risk of going live
# with a fake id. Fill in the real database_id (same database as the
# Pages project's STUDIO_DB binding) immediately before that deploy step.
name = "emmakwon-studio-scheduler"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "STUDIO_DB"
database_name = "emmakwon-studio"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# This site publishes roughly weekly — five minutes is more than
# frequent enough and comfortably inside Cloudflare's free-tier cron
# limits. Cloudflare Cron is UTC-based, which matches scheduled_at being
# stored as UTC — no timezone conversion happens in this Worker.
[triggers]
crons = ["*/5 * * * *"]
