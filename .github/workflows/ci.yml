name: Site CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, recovery, Functions, lint, build, and verify export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository security invariants
        run: npm run check:security

      - name: Check Studio recovery seed
        run: npm run check:studio-seed

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck Cloudflare Functions
        run: npm run check:functions

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify static export
        run: npm run check:site
