# Cloudflare Pages project configuration for emmakwon2.
#
# This does NOT change how the site is built or deployed — Cloudflare
# Pages still builds this repo with `npm run build` and serves the static
# `out/` directory exactly as before. This file exists only to declare
# the D1 binding that `functions/api/admin/*` needs at runtime.
#
# database_id below is a PLACEHOLDER, not a real value — see
# CLOUDFLARE_SETUP.md for how to create the real D1 database and fill
# this in. Until it's replaced, D1-backed admin routes will fail cleanly
# in production; the public site is unaffected either way, since it never
# reads D1.
name = "emmakwon2"
pages_build_output_dir = "out"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "STUDIO_DB"
database_name = "emmakwon-studio"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
